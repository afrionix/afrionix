name: Contribution Panel

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

jobs:
  panel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the panel from the full contribution calendar
        env:
          GH_PANEL_TOKEN: ${{ secrets.GH_PANEL_TOKEN }}
        run: python panel.py
      - name: Publish if changed
        run: |
          mv -f contribution-panel.svg assets/contribution-panel.svg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-panel.svg
          git diff --cached --quiet || git commit -m "Refresh contribution panel"
          git push
