<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img">
<defs>
  <linearGradient id="tc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A101F"/><stop offset="1" stop-color="#060A14"/></linearGradient>
  <radialGradient id="tc-glow" cx="80%" cy="18%" r="70%"><stop offset="0" stop-color="#1F6FEB" stop-opacity=".5"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
  <pattern id="tc-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#EAF2FF" opacity=".025"/></pattern>
  <linearGradient id="tc-trace" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7FB3FF" stop-opacity="0"/><stop offset=".5" stop-color="#7FB3FF"/>
    <stop offset=".75" stop-color="#E9C979"/><stop offset="1" stop-color="#7FB3FF" stop-opacity="0"/>
  </linearGradient>
</defs>
<radialGradient id="tc-pulse" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#BCD7FF"/><stop offset="1" stop-color="#7FB3FF" stop-opacity="0"/></radialGradient>
<style>
  .tc-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; } .tc-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .tc-panel { animation: tc-in 1s cubic-bezier(.16,1,.3,1) both; }
  @keyframes tc-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .tc-trace { stroke-dasharray: 549 571; stroke-dashoffset: 1120; animation: tc-trace 7s linear infinite; }
  @keyframes tc-trace { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .tc-trace { display: none; } .tc-panel { animation: none; } }
</style>
