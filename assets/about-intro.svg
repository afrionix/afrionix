<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img">

<style>
  .fade { opacity: 0; animation: fadeUp .8s ease forwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A101F"/><stop offset="1" stop-color="#060A14"/></linearGradient>
  <radialGradient id="glow" cx="82%" cy="16%" r="70%"><stop offset="0" stop-color="#1F6FEB" stop-opacity=".55"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#EAF2FF" opacity=".03"/></pattern>
</defs>

<rect width="1200" height="420" rx="18" fill="url(#bg)"/>
<rect width="1200" height="420" rx="18" fill="url(#glow)"/>
<rect width="1200" height="420" rx="18" fill="url(#scan)"/>
<circle cx="1050" cy="70" r="120" fill="none" stroke="#24508F" stroke-opacity=".45"/>
<circle cx="1050" cy="70" r="82" fill="none" stroke="#24508F" stroke-opacity=".3"/>
<text x="68" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" letter-spacing="4" fill="#7FB3FF">~/ WHOAMI — ABOUT</text>
<text x="68" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#EAF2FF" class="fade" style="animation-delay:.15s">Software Engineering student at Air University, Islamabad.</text>
<text x="68" y="192" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#EAF2FF" class="fade" style="animation-delay:.35s">I build clean, responsive websites with HTML, CSS &amp; JavaScript —</text>
<text x="68" y="234" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#EAF2FF" class="fade" style="animation-delay:.55s">and I'm levelling up into full-stack development with Node.js.</text>
<line x1="68" y1="292" x2="1132" y2="292" stroke="#24508F" stroke-opacity=".5"/>
<text x="68" y="336" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#5B7290">BASE</text>
<text x="68" y="366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#CFE2FF">ISLAMABAD, PAKISTAN</text>
<text x="468" y="336" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#5B7290">FOCUS</text>
<text x="468" y="366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#CFE2FF">FRONT-END DEVELOPMENT</text>
<text x="868" y="336" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#5B7290">STATUS</text>
<text x="868" y="366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#E9C979">OPEN TO INTERNSHIPS &amp; FREELANCE</text>
</svg>   
