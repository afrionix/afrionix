<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img">

<style>
  .fade { opacity: 0; animation: fadeUp .8s ease forwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A101F"/><stop offset="1" stop-color="#060A14"/></linearGradient>
  <radialGradient id="glow" cx="82%" cy="16%" r="70%"><stop offset="0" stop-color="#1F6FEB" stop-opacity=".55"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#EAF2FF" opacity=".03"/></pattern>
</defs>

<rect width="1200" height="340" rx="18" fill="url(#bg)"/>
<rect width="1200" height="340" rx="18" fill="url(#glow)"/>
<rect width="1200" height="340" rx="18" fill="url(#scan)"/>
<text x="1010" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="230" fill="none" stroke="#24508F" stroke-opacity=".35">02</text>
<text x="68" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" letter-spacing="4" fill="#7FB3FF">PROJECT — 02</text>
<text x="1132" y="86" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#E9C979">COMING SOON</text>
<text x="66" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#F2F7FF">Tetris</text>
<text x="68" y="202" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#B9C7D9">The classic Tetris, written in C++ with object-oriented design —</text>
<text x="68" y="230" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#B9C7D9">currently being cleaned up and prepared for release.</text>
<g class="fade" style="animation-delay:0.9s"><rect x="68" y="252" width="59" height="42" rx="21" fill="#0E1B30" stroke="#24508F"/><text x="98" y="279" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#CFE2FF">C++</text></g><g class="fade" style="animation-delay:1.02s"><rect x="143.4" y="252" width="59" height="42" rx="21" fill="#0E1B30" stroke="#24508F"/><text x="173" y="279" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#CFE2FF">OOP</text></g><g class="fade" style="animation-delay:1.14s"><rect x="218.8" y="252" width="128" height="42" rx="21" fill="#0E1B30" stroke="#24508F"/><text x="283" y="279" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#CFE2FF">Game Logic</text></g>
</svg>
