<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img">
<defs>
  <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A101F"/><stop offset="1" stop-color="#060A14"/></linearGradient>
  <radialGradient id="p2-glow" cx="80%" cy="18%" r="70%"><stop offset="0" stop-color="#1F6FEB" stop-opacity=".5"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
  <pattern id="p2-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#EAF2FF" opacity=".025"/></pattern>
  <linearGradient id="p2-trace" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7FB3FF" stop-opacity="0"/><stop offset=".5" stop-color="#7FB3FF"/>
    <stop offset=".75" stop-color="#E9C979"/><stop offset="1" stop-color="#7FB3FF" stop-opacity="0"/>
  </linearGradient>
</defs>
<pattern id="p2-grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0 H0 V34" fill="none" stroke="#7FB3FF" stroke-opacity=".07"/></pattern>
<style>.p2-chip { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; } @keyframes p2-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .p2-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
  @keyframes p2-draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .p2-draw { animation: none; stroke-dashoffset: 0; } .p2-chip { animation: none; } }
</style>
<rect width="1200" height="370" rx="18" fill="url(#p2-bg)"/>
<rect width="1200" height="370" rx="18" fill="url(#p2-glow)"/>
<rect width="1200" height="370" rx="18" fill="url(#p2-scan)"/>
<rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#7FB3FF" stroke-opacity=".16"/>
<rect class="p2-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p2-trace)" stroke-width="1.5" stroke-linecap="round" style="stroke-dasharray:471 2669;stroke-dashoffset:3140;animation:p2-trace 7s linear infinite"/>
<style>
  .p2-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; } .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; } .p2-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  @keyframes p2-trace { to { stroke-dashoffset: 0; } }
  .p2-in { animation: p2-in 1s cubic-bezier(.16,1,.3,1) both; }
  @keyframes p2-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .p2-trace { display: none; } .p2-in { animation: none; } }
</style>
